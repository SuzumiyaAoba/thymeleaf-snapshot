name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        junit: ['5.11.4', '6.0.0']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew test build --no-daemon -PtestJunitVersion=${{ matrix.junit }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports-junit-${{ matrix.junit }}
          path: build/reports/tests/test/

  # Keep the required status check stable while testing multiple JUnit versions.
  test:
    if: ${{ always() }}
    needs: compatibility
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.compatibility.result }}" = "success"
